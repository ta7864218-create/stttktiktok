<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mamaz | Daftar Harga Paket</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 40px; text-align: center; }

        .card { background: white; padding: 30px; border-radius: 15px; width: 250px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid #0056b3; }
        .price { font-size: 30px; font-weight: bold; color: #0056b3; margin: 15px 0; }
        .btn { background: #0056b3; color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>LIST PAKET PROMOSI MAMAZ</h2>
    <div class="container">
        <div class="card">
            <h3>BULANAN</h3>
            <div class="price">300rb</div>
            <p>Tayang 30 Hari</p>
            <button class="btn" onclick="location.href='https://wa.me/628XXXXXXXXXX'">PILIH</button>
        </div>
        <div class="card">
            <h3>TAHUNAN</h3>
            <div class="price">2.5jt</div>
            <p>Tayang 1 Tahun</p>
            <button class="btn" onclick="location.href='https://wa.me/628XXXXXXXXXX'">PILIH</button>
        </div>
    </div>
    <br><a href="index.html">Kembali ke Home</a>
</body>
</html>
