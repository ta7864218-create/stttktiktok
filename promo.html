<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pilih Paket Promosi</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 50px; text-align: center; }
        .container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 5px solid #0056b3; }
        .price { font-size: 36px; font-weight: bold; color: #0056b3; margin: 20px 0; }
        ul { text-align: left; color: #666; padding: 0; list-style: none; line-height: 2; }
        li::before { content: "✓ "; color: green; font-weight: bold; }
        .btn { background: #0056b3; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>LIST PAKET MURAH</h2>
    <div class="container">
        <div class="card">
            <h3>PAKET BULANAN</h3>
            <div class="price">50rb</div>
            <ul>
                <li>Tayang 30 Hari</li>
                <li>Halaman Utama</li>
                <li>Bebas Ganti Link</li>
            </ul>
            <button class="btn" onclick="location.href='https://wa.me/6282353504864?text=Halo Admin, saya mau ambil Paket Bulanan'">PILIH PAKET</button>
        </div>
        <div class="card">
            <h3>PAKET TAHUNAN</h3>
            <div class="price">120rb</div>
            <ul>
                <li>Tayang 1 Tahun</li>
                <li>Prioritas Atas</li>
                <li>Support 24/7</li>
            </ul>
            <button class="btn" onclick="location.href='https://wa.me/6282353504864?text=Halo Admin, saya mau ambil Paket Tahunan'">PILIH PAKET</button>
        </div>
    </div>
</body>
</html>
