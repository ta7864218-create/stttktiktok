<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamaz Downloader | Elite V23</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue-pro: #0056b3; --pink-pro: #d63384; --dark: #0f1014; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--dark); color: white; text-align: center; overflow-x: hidden; }
        header { background: rgba(0,0,0,0.5); padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 700; background: linear-gradient(90deg, #6a11cb, #2575fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-btn { font-size: 30px; cursor: pointer; color: white; }
        
        /* Layout */
        .hero { padding: 50px 20px; }
        .input-box { max-width: 600px; margin: 0 auto; background: #1e1f26; border-radius: 15px; display: flex; border: 1px solid #333; overflow: hidden; }
        input { border: none; padding: 20px; width: 100%; background: transparent; color: white; outline: none; font-size: 16px; }
        .btn-main { width: 100%; max-width: 600px; background: var(--pink-pro); color: white; border: none; padding: 20px; border-radius: 15px; font-weight: bold; font-size: 18px; margin-top: 20px; cursor: pointer; }

        /* Iklan Besar di Bawah */
        .ad-banner { max-width: 600px; margin: 30px auto; border-radius: 15px; overflow: hidden; border: 1px solid var(--pink-pro); cursor: pointer; }
        .ad-banner img { width: 100%; display: block; }

        /* Timer Download */
        #overlay-dl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .timer { font-size: 60px; font-weight: 700; color: var(--pink-pro); margin-top: 20px; }

        /* Sidebar & Modal */
        .sidebar { position: fixed; right: -100%; top: 0; width: 280px; height: 100%; background: #1a1b20; transition: 0.4s; z-index: 2000; padding: 20px; text-align: left; }
        .sidebar.active { right: 0; }
        .sidebar li { padding: 15px 0; border-bottom: 1px solid #222; cursor: pointer; list-style: none; font-size: 14px; }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <div style="text-align: right; cursor: pointer;" onclick="toggleSide()">×</div>
    <h3 style="color:var(--blue-pro)">MAMAZ MENU</h3>
    <ul>
        <li onclick="location.href='promo.html'">🚀 Pasang Promosi</li>
        <li onclick="bukaLogin()" style="margin-top:50px; opacity:0.1; font-size:10px;">🔐 ADMIN</li>
    </ul>
</div>

<div id="overlay-dl">
    <div style="width:80px; height:80px; border:5px solid #222; border-top:5px solid var(--pink-pro); border-radius:50%; animation: spin 1s linear infinite;"></div>
    <div class="timer" id="count">10</div>
    <p>GENERATING DOWNLOAD LINK...</p>
</div>

<header>
    <div class="logo">MAMAZ PRO</div>
    <div class="menu-btn" onclick="toggleSide()">☰</div>
</header>

<div class="hero">
    <h1>TikTok Downloader</h1>
    <div class="input-box">
        <input type="text" id="url" placeholder="Paste link video di sini...">
    </div>
    <button class="btn-main" onclick="proses()">DOWNLOAD SEKARANG</button>

    <div class="ad-banner" onclick="window.open('promo.html', '_blank')">
        <img src="https://via.placeholder.com/600x350/1e1f26/d63384?text=PROMO+IKLAN+MAMAZ" alt="Ads">
    </div>
</div>

<script>
    function toggleSide() { document.getElementById('sidebar').classList.toggle('active'); }
    function bukaLogin() { 
        let u = prompt("User:"); let p = prompt("Pass:");
        if(u==="admin" && p==="mamaz123") { sessionStorage.setItem("isAdmin","true"); window.location.href="admin_mamaz.html"; }
    }

    function proses() {
        const link = document.getElementById('url').value;
        if(!link) return alert("Isi link dulu!");
        
        // Auto buka halaman promo Lu sendiri
        window.open('promo.html', '_blank');

        let t = 10;
        document.getElementById('overlay-dl').style.display = 'flex';
        const timer = setInterval(() => {
            t--; document.getElementById('count').innerText = t;
            if(t <= 0) {
                clearInterval(timer);
                document.getElementById('overlay-dl').style.display = 'none';
                fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(link)}`)
                .then(r => r.json()).then(d => { window.location.href = d.result.video.no_watermark; });
            }
        }, 1000);
    }
</script>
<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
