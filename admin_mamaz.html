<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mamaz Admin | Dashboard</title>
    <script>
        if (sessionStorage.getItem("isAdmin") !== "true") window.location.href = "index.html";
    </script>
    <style>
        body { background: #f0f4f8; font-family: sans-serif; padding: 40px; }
        .card { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #form-isi { display: none; background: #eef9f1; padding: 15px; margin-top: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#0056b3; text-align:center;">ADMIN CONTROL</h2>
        <div style="border-bottom: 1px solid #eee; margin-bottom: 20px; padding-bottom: 10px;">
            <p><b>User_Hamzx</b> (Tahunan)</p>
            <button class="btn" onclick="tampilForm()">SETUJUI & ISI DATA</button>
        </div>
        
        <div id="form-isi">
            <h4>Data Iklan User:</h4>
            <input type="text" id="link-web" placeholder="Link Web Tujuan">
            <input type="text" id="link-foto" placeholder="Link Foto Iklan">
            <button class="btn" style="background:#0056b3" onclick="alert('Iklan Sudah Tayang!')">SIMPAN & TAYANGKAN</button>
        </div>
    </div>
    <script>function tampilForm() { document.getElementById('form-isi').style.display='block'; }</script>
</body>
</html>
